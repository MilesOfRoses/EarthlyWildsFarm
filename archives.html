---
layout: default
title: Archives
meta: Archives
changefreq: monthly
---




<div class="media-section">
	<h1 class = "centerText">An archive documenting Twin Oaks history with Racial Equity and Social Justice</h1>
	<br>

	<ul class="centerText article-list">
		{% for post in site.posts %}
				<a href="{{site.baseurl}}{{post.url}}">
					<li class="media-section">
						<h2 class="article-title">{{post.title}}</h2>
						<p>{{post.meta}}</p>
					</li>
				</a>	
		{% endfor %}
	</ul>
</div>
